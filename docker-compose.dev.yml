# Docker Compose configuration for development
#
# This file is used for building and testing the ImageMagick image locally
#
# Usage:
#   docker-compose -f docker-compose.dev.yml build
#   docker-compose -f docker-compose.dev.yml run --rm magick-dev
#
# This will drop you into a shell where you can manually run magick commands

services:
  magick-dev:
    build: .
    image: ragedunicorn/magick:dev
    volumes:
      - ./media:/tmp/workdir
    working_dir: /tmp/workdir
    stdin_open: true
    tty: true
    # Override entrypoint to get a shell
    entrypoint: /bin/sh
    labels:
      org.opencontainers.image.title: "ImageMagick on Alpine Linux (Dev)"
      org.opencontainers.image.description: "ImageMagick development environment for testing and debugging"
      org.opencontainers.image.vendor: "ragedunicorn"
    environment:
      - TERM=xterm-256color
      - PS1=\[\033[1;36m\]magick-dev\[\033[0m\]:\w\$
    # Resource limits for development (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 4G
