schemaVersion: 2.0.0

commandTests:
  - name: 'ImageMagick version check'
    command: 'magick'
    args: ['-version']
    expectedOutput:
      - 'ImageMagick 7.1.2'
    exitCode: 0

  # PNG and GIF coders ship with the main imagemagick package
  - name: 'Built-in formats available'
    command: 'magick'
    args: ['-list', 'format']
    expectedOutput:
      - 'PNG'
      - 'GIF'
    exitCode: 0

  # These formats only appear in the list when the delegate subpackage's coder
  # module is installed (modules build), so this is the functional proof that
  # imagemagick-jpeg/-webp/-heic/-svg/-tiff made it into the image
  - name: 'Delegate formats available'
    command: 'magick'
    args: ['-list', 'format']
    expectedOutput:
      - 'JPEG'
      - 'WEBP'
      - 'HEIC'
      - 'SVG'
      - 'TIFF'
    exitCode: 0

  # Runs as the image's default user (magick), so this also proves the
  # /tmp/workdir chown made the working directory writable
  - name: 'Generate and convert image roundtrip'
    command: 'sh'
    args: ['-c', 'magick -size 1x1 xc:red /tmp/workdir/test.png && magick /tmp/workdir/test.png /tmp/workdir/test.jpg && magick identify /tmp/workdir/test.jpg']
    expectedOutput:
      - 'JPEG'
    exitCode: 0

  # freetype, fontconfig and raqm are linked in, but they are only the machinery.
  # Without a font file installed, -list font comes back empty and every
  # -annotate, -draw "text" and label: fails with "unable to read font `'",
  # which reads like a bad argument rather than a missing package
  - name: 'Fonts available for text rendering'
    command: 'magick'
    args: ['-list', 'font']
    expectedOutput:
      - 'DejaVu'
    exitCode: 0

  # The functional proof: rendering a glyph needs the font file itself, and the
  # default font has to resolve without -font being passed
  - name: 'Render text into an image'
    command: 'sh'
    args: ['-c', 'magick -size 320x80 xc:white -gravity center -pointsize 36 -fill black -annotate 0 "RagedUnicorn" /tmp/workdir/text.png && magick identify /tmp/workdir/text.png']
    expectedOutput:
      - 'PNG 320x80'
    exitCode: 0

  - name: 'Check working directory'
    command: 'pwd'
    args: []
    expectedOutput: ['/tmp/workdir']
    exitCode: 0

  - name: 'Non-root user exists'
    command: 'id'
    args: ['magick']
    exitCode: 0
    expectedOutput:
      - 'uid='
      - 'magick'
